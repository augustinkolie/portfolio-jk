services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: btp
      POSTGRES_PASSWORD: btp_dev_password
      POSTGRES_DB: portfolio_btp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U btp -d portfolio_btp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
